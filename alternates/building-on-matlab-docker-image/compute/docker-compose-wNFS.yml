services:
  matlab-compute-node:
    #image: ghcr.io/wryo813/matlab-parallel-server-full:r2025b
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: matlab-compute-node
    network_mode: host
    ipc: host
    restart: always
    # --- コンテナの権限削減 (head/docker-compose.yml と同じ方針) ---
    # レベル 2 ではワーカー上のタスクが mjs と同じ root で動くため、root にできることを狭める。
    # mjs が起動しない場合は docker compose logs で EPERM を確認し、必要なものだけ cap_add に足すこと。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE   # /run/secrets のファイルがホスト側の一般ユーザー所有でも読めるようにする
      - FOWNER
      - FSETID
      - KILL
    security_opt:
      - no-new-privileges:true
    # MATLAB ワーカーはスレッド数が多い。pids_limit は NUM_WORKERS に応じて調整する。MEM_LIMIT=0 は無制限。
    pids_limit: ${PIDS_LIMIT:-16384}
    mem_limit: ${MEM_LIMIT:-0}
    #ulimits:
    #  nofile:
    #    soft: 1048576
    #    hard: 1048576
    #  nproc: -1      # プロセス数制限の解除
    #  memlock: -1    # メモリロック制限の解除
    environment:
      - FQDN=${FQDN:-compute.matlab.internal}
      - JM_HOST=${JM_HOST:-head.matlab.internal}
      - JM_NAME=${JM_NAME:-MyMJS}
      - NUM_WORKERS=${NUM_WORKERS:-4}
      # headノードと必ず同じ値に揃える（不一致だとワーカーがジョブマネージャに登録できない）
      - SECURITY_LEVEL=${SECURITY_LEVEL:-2}
      - ALLOW_INSECURE_SECURITY_LEVEL=${ALLOW_INSECURE_SECURITY_LEVEL:-0}
      # ローカルの mjs サービスがポートを開くまで startworker を待たせる秒数
      - MJS_START_DELAY=${MJS_START_DELAY:-10}
      # AMD の AOCL BLAS/LAPACK を使う設定 (リテラル値。Intel CPU などでは削除する)
      - BLAS_VERSION=libaocl.so
      - LAPACK_VERSION=libaocl.so
      # - OMP_NUM_THREADS=1
      # - BLIS_NUM_THREADS=1
    volumes:
      - ./entrypoint.sh:/opt/mjs/entrypoint.sh:ro
      - nfs-data:${NFS_MOUNT_PATH:-/mnt/nfs}
    secrets:
      - mjs_shared_secret
    entrypoint: ["/bin/bash", "/opt/mjs/entrypoint.sh"]

secrets:
  # head/secrets/mjs_shared_secret と同一のファイルを置く (mjssetup create-shared-secret で作成)
  mjs_shared_secret:
    file: ./secrets/mjs_shared_secret

volumes:
  nfs-data:
    driver: local
    driver_opts:
      type: "nfs"
      # sec= を省略すると AUTH_SYS (UID 申告をそのまま信用) になる。サーバ側は root_squash と
      # secure (既定値) を維持すること。Kerberos が使えるなら NFS_OPTS=rw,sec=krb5p にする。
      o: "addr=${NFS_ADDR},nfsvers=${NFS_VERS:-4.1},${NFS_OPTS:-rw}"
      device: ":${NFS_EXPORT}"
