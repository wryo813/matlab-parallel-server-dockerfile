services:
  matlab-compute-node:
    #image: ghcr.io/wryo813/matlab-parallel-server-full:r2025b
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: matlab-compute-node
    network_mode: host
    ipc: host
    restart: always
    environment:
      - FQDN=${FQDN:-compute.matlab.internal}
      - JM_HOST=${JM_HOST:-head.matlab.internal}
      - JM_NAME=${JM_NAME:-MyMJS}
      - NUM_WORKERS=${NUM_WORKERS:-4}
      # headノードと必ず同じ値に揃える（不一致だとワーカーがジョブマネージャに登録できない）
      - SECURITY_LEVEL=${SECURITY_LEVEL:-2}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        # MATLABインストールパスの動的取得
        EXISTING_MATLAB_LOCATION=$$(dirname $$(dirname $$(readlink -f $$(which matlab))))
        MJS_DEF_FILE="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/mjs_def.sh"
        MJS_BIN="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/mjs"
        START_WORKER_BIN="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/startworker"
        NODESTATUS_BIN="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/nodestatus"

        # ビルド時に保存した元の内容 (mjs_def.sh.orig) に戻してから書き換える。
        # docker compose restart などで同じコンテナを再起動しても、追記した設定行が重複しない
        if [ -f "$${MJS_DEF_FILE}.orig" ]; then
            cat "$${MJS_DEF_FILE}.orig" > "$${MJS_DEF_FILE}"
        fi

        # FQDNの書き換え処理
        if [ -n "$${FQDN}" ] && [ -f "$${MJS_DEF_FILE}" ]; then
            # 既存の HOSTNAME 行を sed で置換する方式は、行の書式がリリースで違うと何もせずに終わる。
            # mjs_def.sh はシェルスクリプトとして読み込まれ、後に書いた代入が有効になるので、末尾に追記する
            printf '\nHOSTNAME="%s"\n' "$${FQDN}" >> "$${MJS_DEF_FILE}"
        fi

        # SECURITY_LEVELをmjs_def.shに注入 (headノードと一致させる)
        if [ -f "$${MJS_DEF_FILE}" ]; then
            echo "SECURITY_LEVEL=$${SECURITY_LEVEL:-2}" >> "$${MJS_DEF_FILE}"
        fi

        # ワーカー起動処理をバックグラウンド（サブシェル）で非同期実行
        (
            # 1. ローカルの mjs サービスが起動するまでポーリング待機(sleepさせるのバカすぎるので直したい)
            sleep 10

            # 2. ワーカープロセスの起動
            "$${START_WORKER_BIN}" -jobmanagerhost "$${JM_HOST}" -jobmanager "$${JM_NAME}" -num "$${NUM_WORKERS}" -clean -v
        ) &

        # メインプロセスとして mjs サービスをフォアグラウンドで起動し、PID 1 に置換
        exec "$${MJS_BIN}" console -clean
