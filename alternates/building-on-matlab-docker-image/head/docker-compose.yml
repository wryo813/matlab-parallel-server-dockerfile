services:
  matlab-head-node:
    #image: ghcr.io/wryo813/matlab-parallel-server-full:r2025b
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: matlab-head-node
    network_mode: host
    ipc: host
    restart: always
    # --- コンテナの権限削減 ---
    # mjs は root で動くため (MJS の仕様上、レベル 2 ではタスクも root で動く)、
    # Docker 既定のケーパビリティを落として、root にできることを狭める。
    #   NET_RAW を落とす      -> ホスト NIC でのパケット取得を防ぐ
    #   SETUID/SETGID を落とす -> 任意 UID への切り替え (NFS 上でのなりすまし) を防ぐ
    #   NET_BIND_SERVICE を落とす -> 1024 未満のポートへの bind を防ぐ
    # mjs が起動しない場合は docker compose logs で EPERM を確認し、必要なものだけ cap_add に足すこと。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE   # /run/secrets のファイルがホスト側の一般ユーザー所有でも読めるようにする
      - FOWNER
      - FSETID
      - KILL
    security_opt:
      - no-new-privileges:true
    # 1 ユーザーのジョブでホストを巻き込まないための上限。MATLAB はスレッド数が多いので
    # pids_limit はワーカー数に応じて増やすこと。MEM_LIMIT=0 は無制限。
    pids_limit: ${PIDS_LIMIT:-16384}
    mem_limit: ${MEM_LIMIT:-0}
    #ulimits:
    #  nofile:
    #    soft: 1048576
    #    hard: 1048576
    #  nproc: -1      # プロセス数制限の解除
    #  memlock: -1    # メモリロック制限の解除
    environment:
      - FQDN=${FQDN:-head.matlab.internal}
      - JM_NAME=${JM_NAME:-MyMJS}
      # 2 未満は認証なしの root 実行になるため entrypoint が起動を拒否する
      - SECURITY_LEVEL=${SECURITY_LEVEL:-2}
      - ALLOW_INSECURE_SECURITY_LEVEL=${ALLOW_INSECURE_SECURITY_LEVEL:-0}
      - LDAP_HOST=${LDAP_HOST:?LDAP_HOST is required (authentik LDAP outpost hostname)}
      # 既定は LDAPS。ldap にすると全ユーザーのパスワードが平文で流れる
      - LDAP_SCHEME=${LDAP_SCHEME:-ldaps}
      - LDAP_PORT=${LDAP_PORT:-636}
      # LDAP_SECURITY_PRINCIPAL_FORMAT: [username] が短いユーザ名に置換される (角括弧が正式トークン)
      # 例: cn=[username],ou=users,dc=ldap,dc=goauthentik,dc=io
      - LDAP_PRINCIPAL_FORMAT=${LDAP_PRINCIPAL_FORMAT:-cn=[username],ou=users,dc=ldap,dc=goauthentik,dc=io}
      - MJS_ADMIN_USER=${MJS_ADMIN_USER:-mjsadmin}
      # LDAP同期間隔(秒)。0=毎アクセス時に同期、1800=30分毎(既定)。短いほど無効化が早く反映される
      - LDAP_SYNC_INTERVAL=${LDAP_SYNC_INTERVAL:-1800}
      # mjs サービスがポートを開くまで startjobmanager を待たせる秒数
      - MJS_START_DELAY=${MJS_START_DELAY:-10}
      # startjobmanager のパスワードプロンプトを待つ上限秒数
      - MJS_PROMPT_TIMEOUT=${MJS_PROMPT_TIMEOUT:-180}
    volumes:
      - ./entrypoint.sh:/opt/mjs/entrypoint.sh:ro
      - ./feed-admin-password.py:/opt/mjs/feed-admin-password.py:ro
      # certs/ldap-ca.pem があれば LDAPS 用 CA として JRE の信頼ストアに取り込む (無くても起動する)
      - ./certs:/opt/mjs/certs:ro
    secrets:
      - mjs_admin_pass
      - mjs_shared_secret
    entrypoint: ["/bin/bash", "/opt/mjs/entrypoint.sh"]

  matlab-mjs-proxy:
    image: ghcr.io/mathworks/parallel-server-proxy:v1.0.1
    container_name: matlab-mjs-proxy
    network_mode: host
    restart: always
    depends_on:
      - matlab-head-node
    # Go 製の単一バイナリで、ケーパビリティも書き込み可能な FS も不要
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    secrets:
      - proxy_certificate
    command:
      - -port
      - "${PROXY_PORT:-1080}"
      - -certificate
      - /run/secrets/proxy_certificate

secrets:
  # mjssetup generate-certificate で、下の mjs_shared_secret から生成したもの。
  # クライアント証明書と秘密鍵を含むので、プロキシ以外には渡さない。
  proxy_certificate:
    file: ./certs/proxy-certificate.json
  # MJS_ADMIN_USER の LDAP パスワード (1 行)
  mjs_admin_pass:
    file: ./secrets/mjs_admin_pass.txt
  # クラスタ全体で共有するシークレット (mjssetup create-shared-secret で作成)。
  # 通信の暗号化、特権コマンドの署名、クライアント証明書の検証のすべてに使う。
  # compute ノードにも同じファイルを配布する。
  mjs_shared_secret:
    file: ./secrets/mjs_shared_secret
