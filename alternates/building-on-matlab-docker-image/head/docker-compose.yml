services:
  matlab-head-node:
    #image: ghcr.io/wryo813/matlab-parallel-server-full:r2025b
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: matlab-head-node
    network_mode: host
    ipc: host
    restart: always
    #cap_add:
    #  - SYS_NICE     # コンテナ内でのプロセス優先度調整権限を付与
    #ulimits:
    #  nofile:
    #    soft: 1048576
    #    hard: 1048576
    #  nproc: -1      # プロセス数制限の解除
    #  memlock: -1    # メモリロック制限の解除
    environment:
      - FQDN=${FQDN:-head.matlab.internal}
      - JM_NAME=${JM_NAME:-MyMJS}
      - SECURITY_LEVEL=${SECURITY_LEVEL:-2}
      - LDAP_HOST=${LDAP_HOST:?LDAP_HOST is required (authentik LDAP outpost hostname)}
      - LDAP_PORT=${LDAP_PORT:-389}
      # LDAP_SECURITY_PRINCIPAL_FORMAT: [username] が短いユーザ名に置換される (角括弧が正式トークン)
      # 例: cn=[username],ou=users,dc=ldap,dc=goauthentik,dc=io
      - LDAP_PRINCIPAL_FORMAT=${LDAP_PRINCIPAL_FORMAT:-cn=[username],ou=users,dc=ldap,dc=goauthentik,dc=io}
      - MJS_ADMIN_USER=${MJS_ADMIN_USER:-mjsadmin}
      # LDAP同期間隔(秒)。0=毎アクセス時に同期、1800=30分毎(既定)
      - LDAP_SYNC_INTERVAL=${LDAP_SYNC_INTERVAL:-1800}
    secrets:
      - proxy_certificate
      - mjs_admin_pass
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        # MATLABインストールパスの動的取得
        EXISTING_MATLAB_LOCATION=$$(dirname $$(dirname $$(readlink -f $$(which matlab))))
        MJS_DEF_FILE="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/mjs_def.sh"
        MJS_BIN="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/mjs"
        START_JOB_MANAGER_BIN="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/startjobmanager"
        NODESTATUS_BIN="$${EXISTING_MATLAB_LOCATION}/toolbox/parallel/bin/nodestatus"

        # ビルド時に保存した元の内容 (mjs_def.sh.orig) に戻してから書き換える。
        # docker compose restart などで同じコンテナを再起動しても、追記した設定行が重複しない
        if [ -f "$${MJS_DEF_FILE}.orig" ]; then
            cat "$${MJS_DEF_FILE}.orig" > "$${MJS_DEF_FILE}"
        fi

        # FQDNの書き換え処理
        if [ -n "$${FQDN}" ] && [ -f "$${MJS_DEF_FILE}" ]; then
            # 既存の HOSTNAME 行を sed で置換する方式は、行の書式がリリースで違うと何もせずに終わる。
            # mjs_def.sh はシェルスクリプトとして読み込まれ、後に書いた代入が有効になるので、末尾に追記する
            printf '\nHOSTNAME="%s"\n' "$${FQDN}" >> "$${MJS_DEF_FILE}"
        fi

        # LDAP認証 / セキュリティ設定を mjs_def.sh 末尾に注入 (R2023a以降のパラメータ)
        if [ -f "$${MJS_DEF_FILE}" ]; then
            printf '\n# --- LDAP認証設定 (自動生成) ---\n' >> "$${MJS_DEF_FILE}"
            printf 'SECURITY_LEVEL=%s\n' "$${SECURITY_LEVEL:-2}" >> "$${MJS_DEF_FILE}"
            printf 'ADMIN_USER=%s\n' "$${MJS_ADMIN_USER:-mjsadmin}" >> "$${MJS_DEF_FILE}"
            printf 'USE_LDAP_SERVER_AUTHENTICATION=true\n' >> "$${MJS_DEF_FILE}"
            printf 'LDAP_URL=ldap://%s:%s\n' "$${LDAP_HOST}" "$${LDAP_PORT:-389}" >> "$${MJS_DEF_FILE}"
            printf 'LDAP_SECURITY_PRINCIPAL_FORMAT=%s\n' "$${LDAP_PRINCIPAL_FORMAT}" >> "$${MJS_DEF_FILE}"
            printf 'LDAP_SYNCHRONIZATION_INTERVAL_SECS=%s\n' "$${LDAP_SYNC_INTERVAL:-1800}" >> "$${MJS_DEF_FILE}"
        fi

        # ジョブマネージャー起動処理をバックグラウンド（サブシェル）で非同期実行
        (
            # エラーによるサブシェルの強制終了を防ぐ
            set +e

            # MJSサービスプロセスがポートのバインド等を完了するためのバッファ時間（sleepさせるのバカすぎるので直したい）
            sleep 10

            # SECURITY_LEVEL>=2 では startjobmanager がADMIN_USERのLDAPパスワードを /dev/tty から対話入力で要求する。
            # stdin パイプは /dev/tty をバイパスするため効かない。
            # script コマンドで PTY を作成し、パスワードを擬似端末経由で渡す。
            MJS_ADMIN_PASS_FILE="/run/secrets/mjs_admin_pass"
            if [ -f "$${MJS_ADMIN_PASS_FILE}" ]; then
                MJS_ADMIN_PASS=$$(tr -d '\n\r' < "$${MJS_ADMIN_PASS_FILE}")
            else
                MJS_ADMIN_PASS="$${MJS_ADMIN_PASS}"
            fi
            # PTY のエコーにより、流し込んだパスワードが script の出力 (= docker logs) にそのまま出る。
            # 出力からパスワード文字列をリテラル一致で伏せ字にしてからログへ流す
            printf '%s\n' "$${MJS_ADMIN_PASS}" \
                | script -q -c "$${START_JOB_MANAGER_BIN} -name $${JM_NAME} -clean -v" /dev/null \
                | MJS_ADMIN_PASS="$${MJS_ADMIN_PASS}" awk '{ p = ENVIRON["MJS_ADMIN_PASS"]; if (p != "") { while ((i = index($$0, p)) > 0) $$0 = substr($$0, 1, i - 1) "********" substr($$0, i + length(p)) } print; fflush() }'
        ) &

        # 前回の起動で残った PID ファイルを消す。docker restart ではコンテナのファイルシステムが残り、
        # mjsd.pid の中身は前回の PID 1 のまま。mjs は `ps -p 1` で生存を確認するため、新しい entrypoint (PID 1) を
        # 前回の mjs と誤認し "already running" で終了してしまう。PIDBASE は Dockerfile で /var/run/mjs に設定している
        rm -f /var/run/mjs/mjsd.pid

        # メインプロセスとして mjs サービスをフォアグラウンドで起動し、PID 1 に置換
        exec "$${MJS_BIN}" console -clean

  matlab-mjs-proxy:
    image: ghcr.io/mathworks/parallel-server-proxy:v1.0.1
    container_name: matlab-mjs-proxy
    network_mode: host
    restart: always
    depends_on:
      - matlab-head-node
    secrets:
      - proxy_certificate
    command:
      - -port
      - "${PROXY_PORT:-1080}"
      - -certificate
      - /run/secrets/proxy_certificate

secrets:
  proxy_certificate:
    file: ./certs/proxy-certificate.json
  mjs_admin_pass:
    file: ./secrets/mjs_admin_pass.txt